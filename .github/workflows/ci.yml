# Checks every push and pull request: format, lint, type check, tests, a JSR publish dry run, the npm build, an
# import of the built npm package in Node 22.0.0 (the lowest version package.json allows) and Node 24, and the
# release tarball check (scripts/release_tarball.py) on the packed package.
#
# Actions are pinned to full commit SHAs (resolved with `git ls-remote` and checked with the GitHub API on
# 14 Oct 2026). The comment after each SHA is the release tag it points at.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno install --frozen
      - run: deno task check
      - run: deno task test
      - run: deno task publish:check
      - run: deno task build:npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.0.0"
      # better-auth comes from npm/node_modules, which `deno task npm:deps` filled (no install scripts run).
      - name: Import the npm build in Node 22.0.0
        working-directory: npm
        run: node --input-type=module -e "$IMPORT_CHECK"
        env:
          IMPORT_CHECK: |
            const m = await import("./esm/mod.js");
            const p = m.signupBouncer({ apiKey: "sb_live_ci" });
            if (p.id !== "signupbouncer" || typeof p.hooks.before[0].handler !== "function") process.exit(1);
            console.log(process.version, "exports:", Object.keys(m).sort().join(" "));
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Import the npm build in Node 24
        working-directory: npm
        run: node --input-type=module -e "$IMPORT_CHECK"
        env:
          IMPORT_CHECK: |
            const m = await import("./esm/mod.js");
            const p = m.signupBouncer({ apiKey: "sb_live_ci" });
            if (p.id !== "signupbouncer" || typeof p.hooks.before[0].handler !== "function") process.exit(1);
            console.log(process.version, "exports:", Object.keys(m).sort().join(" "));
      - name: Release tarball checker tests
        run: python3 -I scripts/release_tarball_test.py
      # The same tarball check the publish workflow's npm job runs, so a build change that would stop a release (a new
      # publishConfig key, say) fails here first. npm pack also lists the files npm would publish.
      - name: Pack the npm package and run the release tarball check
        run: |
          mkdir "${RUNNER_TEMP}/pack"
          cd npm
          npm pack --ignore-scripts --pack-destination "${RUNNER_TEMP}/pack"
          version="$(node -p 'require("./package.json").version')"
          python3 -I ../scripts/release_tarball.py "${RUNNER_TEMP}/pack/signupbouncer-better-auth-${version}.tgz" \
            "${RUNNER_TEMP}/pack/clean.tgz" "@signupbouncer/better-auth" "${version}"
