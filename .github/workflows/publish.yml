# Publishes a release when you push a version tag such as v0.1.0. The tag must match "version" in deno.json.
#
# - verify: tag matches deno.json, no "[FILL" placeholder left in a published file, checks and tests pass.
# - jsr: `deno publish`, authenticated with GitHub's OIDC token (no secret). The JSR package must be linked to this
#   repository in its settings on jsr.io first (https://jsr.io/docs/publishing-packages#publishing-from-github-actions).
# - build-npm: builds npm/ with dnt in a job that holds no OIDC permission and no secret, and hands the files on as an
#   artifact. Build tooling never runs where publishing credentials exist.
# - npm: downloads that artifact and runs `npm publish --provenance --access public` with the NPM_TOKEN repository
#   secret. It needs id-token: write for the provenance statement (https://docs.npmjs.com/generating-provenance-statements).
#
# Actions are pinned to full commit SHAs (resolved with `git ls-remote` and checked with the GitHub API on
# 14 Oct 2026). The comment after each SHA is the release tag it points at.
name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Tag matches deno.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match deno.json version ${version}" >&2
            exit 1
          fi
      - name: No placeholder left in a published file
        run: |
          if grep -n '\[FILL' mod.ts internal.ts README.md LICENSE deno.json; then
            echo "Fill in every [FILL ...] placeholder before releasing." >&2
            exit 1
          fi
      - run: deno install --frozen
      - run: deno task check
      - run: deno task test
      - run: deno task publish:check

  jsr:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for JSR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno install --frozen
      - run: deno publish

  build-npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno install --frozen
      - run: deno task build:npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.0.0"
      - name: Import the npm build in Node 22.0.0
        working-directory: npm
        run: |
          node --input-type=module -e '
            const m = await import("./esm/mod.js");
            if (m.signupBouncer({ apiKey: "sb_live_ci" }).id !== "signupbouncer") process.exit(1);
          '
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          include-hidden-files: true # .npmignore
          if-no-files-found: error
          retention-days: 7
          path: |
            npm/
            !npm/node_modules/
            !npm/deno.lock

  npm:
    needs: [build-npm, jsr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for npm provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: npm
      - name: No placeholder left in the package
        run: |
          if grep -rn '\[FILL' npm; then
            echo "Fill in every [FILL ...] placeholder before releasing." >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --ignore-scripts
