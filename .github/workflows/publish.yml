# Publishes a release when you push a version tag such as v0.1.0. The tag must match "version" in deno.json.
#
# - JSR: `deno publish`, authenticated with GitHub's OIDC token (no secret). The JSR package must be linked to this
#   repository in its settings on jsr.io first (https://jsr.io/docs/publishing-packages#publishing-from-github-actions).
# - npm: builds npm/ with dnt, then `npm publish --provenance --access public` with the NPM_TOKEN repository secret.
#
# Actions are pinned to full commit SHAs (resolved with `git ls-remote` and checked with the GitHub API on
# 14 Oct 2026). The comment after each SHA is the release tag it points at.
name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Tag matches deno.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(deno eval 'console.log(JSON.parse(Deno.readTextFileSync("deno.json")).version)')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match deno.json version ${version}" >&2
            exit 1
          fi
      - run: deno install --frozen
      - run: deno task check
      - run: deno task test
      - run: deno task publish:check

  jsr:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for JSR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno install --frozen
      - run: deno publish

  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: deno install --frozen
      - run: deno task build:npm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Publish to npm
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --ignore-scripts
